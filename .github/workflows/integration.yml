name: "Integration"
on:
  push: {}
jobs:
  compile:
    name: "Compile"
    runs-on: ubuntu-latest
    steps:
      - name: "sync"
        uses: actions/checkout@v3

      - name: "invoke"
        run: |
          chmod +x boot
          ./boot
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

